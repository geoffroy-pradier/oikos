# Supabase local (développement et tests). Référence : https://supabase.com/docs/guides/local-development/cli/config
# Seuls les services utiles au jeu sont démarrés (docs/specs/14-infrastructure.md, 14.2).
project_id = "oikos"

[api]
enabled = true
port = 54321
# Seul `public` (vues de lecture) est exposé par l'API ; `game`, `config`, `telemetry`, `admin` ne le sont jamais.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
# Le back-office (apps/admin) tourne sur son propre port : son lien magique doit pouvoir y revenir.
additional_redirect_urls = ["http://127.0.0.1:5174"]
enable_signup = true

# Second facteur (TOTP), obligatoire pour le back-office (docs/specs/15-back-office-olympe.md, 15.4).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enabled = true
enable_confirmations = false
# En local, deux liens de connexion peuvent être demandés coup sur coup (tests de reconnexion).
max_frequency = "1s"

# Boîte de réception locale pour les liens magiques.
[local_smtp]
enabled = true
port = 54324

[realtime]
enabled = false

[storage]
enabled = false

# Studio, l'interface d'administration de la base locale : http://127.0.0.1:54323. Le contrôle `ci` ne
# le démarre pas (`pnpm db:start:ci`).
[studio]
enabled = true
port = 54323

[edge_runtime]
enabled = false

[analytics]
enabled = false
