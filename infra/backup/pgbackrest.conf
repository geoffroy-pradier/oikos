# Archivage continu vers un stockage objet compatible S3 (docs/specs/14-infrastructure.md, 14.3).
# Les identifiants S3 et la phrase de chiffrement sont fournis par variables d'environnement
# PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS : jamais ici.
[global]
repo1-type=s3
repo1-path=/oikos
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=6
archive-async=y
compress-type=zst
start-fast=y
log-level-console=info

[oikos]
pg1-path=/var/lib/postgresql/data
pg1-user=supabase_admin
