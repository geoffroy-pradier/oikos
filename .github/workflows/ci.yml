name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Les ports de Supabase local (54320 à 54329) sont dans la plage éphémère de Linux : une connexion
      # sortante du runner (téléchargement, tirage d'image) peut en occuper un et faire échouer le démarrage.
      # On les réserve avant toute autre étape : le noyau ne les attribue plus aux connexions sortantes.
      - name: Reserve Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - uses: actions/checkout@v4

      # Tant que le monorepo n'est pas initialisé (ticket 1), il n'y a rien à vérifier.
      - name: Detect workspace
        id: ws
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.ws.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.ws.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.ws.outputs.present == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.ws.outputs.present == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.ws.outputs.present == 'true'
        run: pnpm test

      # pgTAP sur Supabase local : migrations rejouées depuis zéro, puis tests de schéma et de règles par ligne.
      - name: Start Supabase
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        # Filet de sécurité : une connexion de courte durée ouverte avant la réservation peut encore tenir un
        # port. En cas d'échec, on journalise l'occupant avant de réessayer une fois.
        run: pnpm db:start || (sudo ss -tanp | grep ':5432' || true; pnpm db:stop && sleep 5 && pnpm db:start)

      - name: Test database
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        run: pnpm db:reset && pnpm test:db

      # Filet de la règle 9 : `infra/deploy.sh` n'applique que les migrations nouvelles, mais toute la suite
      # doit encore se rejouer sur la base migrée sans changer le schéma.
      - name: Replay migrations
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        env:
          REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:replay

      # Application des migrations au déploiement (`infra/apply-migrations.sh`), dans des bases jetables.
      - name: Deploy migrations
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        env:
          MIGRATIONS_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:deploy

      - name: Integration tests
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        run: pnpm test:integration

      # Même rejeu, sur la base que les tests d'intégration ont remplie de données.
      - name: Replay migrations on data
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        env:
          REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:replay

      - name: End-to-end tests
        if: steps.ws.outputs.present == 'true' && hashFiles('apps/web/playwright.config.ts') != ''
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e

      # Traces des tests rejoués (échec puis nouvel essai), à ouvrir avec `playwright show-trace`.
      - name: Upload end-to-end traces
        if: always() && hashFiles('apps/web/test-results/**/trace.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: apps/web/test-results/**/trace.zip
          retention-days: 14

      # Les images de l'API et du moteur doivent toujours pouvoir être construites.
      - name: Build server images
        if: steps.ws.outputs.present == 'true' && hashFiles('infra/docker/Dockerfile') != ''
        run: |
          for app in api engine; do
            [ -f "apps/$app/src/main.ts" ] || continue
            node infra/docker/bundle.mjs "$app" "build/$app/main.mjs"
            docker build -q -f infra/docker/Dockerfile -t "oikos-$app:ci" "build/$app"
          done

      # Clients statiques : construits, mis en image, puis installés comme sur le serveur et servis par
      # Caddy avec le Caddyfile du dépôt.
      - name: Build and install static clients
        if: steps.ws.outputs.present == 'true' && hashFiles('infra/docker/static.sh') != ''
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: bash infra/test-static.sh
