name: ci

on:
  pull_request:
  push:
    branches: [main]

# Un nouveau commit sur une demande de fusion annule le `ci` périmé de la même branche. Chaque envoi sur `main` a son
# propre groupe : il n'est jamais annulé, ni remplacé en attente par l'envoi suivant.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Les contrôles tournent en parallèle, chacun dans son propre runner : vérifications statiques, base de
# données, tests d'intégration, banc d'équilibrage et bout en bout (découpés en morceaux, chacun avec sa propre
# pile Supabase, #900), images.
# Le job `ci`, en dernier, est le seul contrôle requis : il est vert si tous les autres le sont, ou si ceux
# qui ne concernent pas le changement ont été sautés (documents seuls).
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Une migration publiée est immuable : `infra/deploy.sh` ne rejoue jamais une migration enregistrée, une
      # modification sur place ne serait donc jamais déployée. On corrige par une migration nouvelle.
      # Base de comparaison : la branche de base d'une demande de fusion, ou l'état de `main` avant l'envoi.
      - name: Published migrations are immutable
        id: diff
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --diff-filter=MDR --name-only "$base" HEAD -- packages/db/supabase/migrations)"
          if [ -n "$changed" ]; then
            echo "::error::Migrations publiées modifiées, supprimées ou renommées : $changed"
            exit 1
          fi
          # Documents seuls (docs/, fichiers Markdown, réglages des agents) : ni base, ni intégration, ni
          # bout en bout. Tout autre fichier déclenche toute la suite. Sans détection des renommages, un
          # fichier de code renommé en document compte par son ancien chemin. La liste est lue avant le
          # filtre : un tube interrompu ne peut pas la faire passer pour vide.
          files="$(git diff --no-renames --name-only "$base" HEAD)"
          if printf '%s\n' "$files" | grep -qvE '^(docs/|\.claude/)|\.md$|^$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documents seuls : base, intégration, bout en bout et images sautés."
          fi

  # Lint, types et tests unitaires. Le cache de Turborepo est gardé d'une exécution à l'autre : un paquet
  # que le changement ne touche pas n'est ni revérifié ni retesté.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  # pgTAP sur Supabase local : migrations rejouées depuis zéro, tests de schéma et de règles par ligne, rejeu
  # de la suite (règle 9) et application des migrations comme au déploiement.
  database:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Les ports de Supabase local (54320 à 54329) sont dans la plage éphémère de Linux : une connexion
      # sortante du runner peut en occuper un et faire échouer le démarrage. On les réserve d'abord.
      - name: Reserve Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: bash infra/ci-supabase-start.sh
      - name: Test database
        run: pnpm db:reset && pnpm test:db
      # Identifie, dans le journal de Postgres, la session qui tient un verrou plus d'une seconde (ticket #489).
      - name: Log lock waits
        run: |
          psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres -X -c "alter system set log_lock_waits = on" -c "select pg_reload_conf()" || echo "log_lock_waits non activé"
      - name: Replay migrations
        env:
          REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:replay
      - name: Lock waits in the Postgres log
        if: failure()
        run: docker logs supabase_db_oikos 2>&1 | grep -iE 'lock|deadlock' | tail -n 50 || true
      - name: Deploy migrations
        env:
          MIGRATIONS_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:deploy

  # Tests d'intégration, un job par morceau, chacun sur sa propre base. L'API se découpe en deux : le banc
  # d'une cité (#78, deux minutes à lui seul) et tous ses autres fichiers ; le moteur, la configuration et la
  # passerelle IA forment le troisième morceau. Dans un morceau, les fichiers et les paquets passent l'un après
  # l'autre, comme en local (`--concurrency=1`, `fileParallelism: false`) : ils partagent une base. Le banc d'une
  # cité joue son propre monde et ne lit rien des autres fichiers. Eux restent ensemble, sans `--shard` :
  # `balance/candidate` lit la version de configuration n° 1, qu'un fichier passé avant lui a enregistrée.
  integration:
    name: integration (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Le dernier morceau prend tous les autres paquets, et le deuxième tous les autres fichiers de l'API,
        # y compris ceux qui viendront.
        include:
          - part: '@oikos/api, banc d’une cité'
            filter: '@oikos/api'
            args: src/balance.integration.test.ts
          - part: '@oikos/api'
            filter: '@oikos/api'
            args: --exclude=src/balance.integration.test.ts
          - part: '!@oikos/api'
            filter: '!@oikos/api'
            args: ''
    steps:
      - name: Reserve Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: bash infra/ci-supabase-start.sh
      - name: Integration tests
        env:
          FILTER: ${{ matrix.filter }}
          ARGS: ${{ matrix.args }}
        run: pnpm exec turbo run test:integration --concurrency=1 "--filter=$FILTER" ${ARGS:+-- "$ARGS"}
      # Un déploiement arrête l'API et le moteur avant de migrer. De même, aucune connexion laissée par les
      # tests (une requête encore en cours quand vitest s'arrête) ne doit croiser le rejeu : elle peut tenir
      # un verrou que le rejeu attend, et attendre une ligne que le rejeu tient (interblocage vu sur #308,
      # cause non établie). Toutes les connexions de la base sont listées dans le journal du job ; seules
      # celles des tests (rôle postgres) sont fermées.
      - name: Close test connections
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -q -v ON_ERROR_STOP=1 <<'SQL'
          select pid, usename, backend_type, state, wait_event_type, wait_event, left(query, 120) as query,
                 case when usename = 'postgres' and backend_type = 'client backend'
                      then pg_terminate_backend(pid, 5000) end as closed
            from pg_stat_activity
           where datname = current_database() and pid <> pg_backend_pid();
          do $check$ begin
            if exists (select from pg_stat_activity
                        where datname = current_database() and usename = 'postgres'
                          and backend_type = 'client backend' and pid <> pg_backend_pid()) then
              raise exception 'des connexions des tests restent ouvertes';
            end if;
          end $check$;
          SQL
      # Identifie, dans le journal de Postgres, la session qui tient un verrou plus d'une seconde (ticket #489).
      - name: Log lock waits
        run: |
          psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres -X -c "alter system set log_lock_waits = on" -c "select pg_reload_conf()" || echo "log_lock_waits non activé"
      # Filet de la règle 9 : la suite des migrations se rejoue aussi sur une base remplie de données.
      - name: Replay migrations on data
        env:
          REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:replay
      - name: Lock waits in the Postgres log
        if: failure()
        run: docker logs supabase_db_oikos 2>&1 | grep -iE 'lock|deadlock' | tail -n 50 || true

  # Banc d'équilibrage des quatre cités (#281, README, « Banc d'équilibrage ») et simulateur (#284) : à part, car ils
  # durent plusieurs minutes. Un morceau par fichier `.bench.ts` (`vitest --shard`, #900) : chacun joue son propre
  # monde neuf (`openBench`) et ne lit rien de l'autre. Un banc ajouté sans morceau de plus tourne quand même, dans
  # un morceau existant ; on ajoute alors un morceau. Un échec rend `ci` rouge. La durée de chaque banc est bornée
  # par son test (`MAX_MINUTES`) et par ce délai, et notée dans le résumé du job.
  balance:
    name: balance (${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        shards: [2]
    steps:
      - name: Reserve Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: bash infra/ci-supabase-start.sh
      - name: Balance bench
        env:
          BALANCE_REPORT: ${{ github.workspace }}/balance-report/measures.json
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          started="$(date +%s)"
          status=0
          pnpm exec turbo run test:balance --filter=@oikos/api -- "--shard=$SHARD" || status=$?
          echo "Banc d'équilibrage : $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Mesures du banc (monnaie, panier, couverture, population, net des robinets et des puits, marges), pour #283,
      # dans l'artefact du morceau qui a joué le banc des quatre cités.
      - name: Upload balance measures
        if: always() && hashFiles('balance-report/measures.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balance-measures-${{ matrix.shard }}
          path: balance-report/measures.json
          retention-days: 90

  # Bout en bout, un job par morceau (#900), chacun avec sa propre pile Supabase, son API et sa construction : Olympe
  # d'un côté, le jeu en trois de l'autre (`playwright --shard`). Playwright découpe par fichier et par projet, sans
  # jamais séparer les tests d'un même fichier (pas de `fullyParallel`), qui gardent leur ordre. Les fichiers
  # tournent déjà en parallèle sur une même base (deux workers) : ils ne dépendent pas les uns des autres.
  e2e:
    name: e2e (${{ matrix.app }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: web, shard: 1, shards: 3 }
          - { app: web, shard: 2, shards: 3 }
          - { app: web, shard: 3, shards: 3 }
          - { app: admin, shard: 1, shards: 1 }
    steps:
      - name: Reserve Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: bash infra/ci-supabase-start.sh
      # Navigateur du contrôle visuel (#700, `apps/web/e2e/visual-browser.ts`) : l'image Docker de Playwright, à la
      # version du dépôt, téléchargée à part (environ 1,2 Go) pour que sa durée ne pèse pas sur le délai des tests.
      - name: Pull Playwright image
        run: docker pull "mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"
      - name: End-to-end tests
        env:
          APP: ${{ matrix.app }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: pnpm exec playwright install --with-deps chromium && pnpm --filter "@oikos/$APP" test:e2e "--shard=$SHARD"
      # Traces des tests rejoués (échec puis nouvel essai), à ouvrir avec `playwright show-trace`.
      - name: Upload end-to-end traces
        if: always() && hashFiles('apps/web/test-results/**/trace.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.app }}-${{ matrix.shard }}
          path: apps/web/test-results/**/trace.zip
          retention-days: 14
      # Écarts du contrôle visuel (#700) : image attendue, image obtenue et différence, rendues par le navigateur
      # de l'image Docker de Playwright ; à relire avant toute mise à jour d'une référence.
      - name: Upload visual differences
        if: always() && hashFiles('apps/*/test-results/**/*-diff.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-${{ matrix.app }}-${{ matrix.shard }}
          path: |
            apps/*/test-results/**/*-expected.png
            apps/*/test-results/**/*-actual.png
            apps/*/test-results/**/*-diff.png
          retention-days: 14

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Les images de l'API et du moteur doivent toujours pouvoir être construites.
      - name: Build server images
        run: |
          for app in api engine; do
            [ -f "apps/$app/src/main.ts" ] || continue
            node infra/docker/bundle.mjs "$app" "build/$app/main.mjs"
            docker build -q -f infra/docker/Dockerfile -t "oikos-$app:ci" "build/$app"
          done
      # Clients statiques : construits, mis en image, puis installés comme sur le serveur et servis par
      # Caddy avec le Caddyfile du dépôt.
      - name: Build and install static clients
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: bash infra/test-static.sh

  # Seul contrôle à attendre avant une fusion (CLAUDE.md, boucle de travail, étapes 7 et 8). Il n'est créé
  # qu'à la fin de l'exécution : tant qu'il est absent, rien n'est fusionné. Tout job ajouté à ce fichier
  # doit être ajouté à `needs` et à la liste `expected` ci-dessous. Un job en matrice (`integration`, `balance`,
  # `e2e`) y figure une fois, sous son identifiant : son résultat n'est `success` que si chacun de ses morceaux l'est,
  # et un morceau ajouté à sa matrice n'a rien à changer ici.
  ci:
    if: always()
    needs: [changes, static, database, integration, balance, e2e, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped for a documentation-only change
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            (.changes.outputs.code) as $code
            | (keys == ["balance", "build", "changes", "database", "e2e", "integration", "static"])
            and (to_entries
            | all(.value.result == "success"
                  or (.value.result == "skipped" and $code == "false"
                      and (.key | IN("changes", "static") | not))))' > /dev/null
