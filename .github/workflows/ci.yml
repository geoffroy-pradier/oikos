name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Tant que le monorepo n'est pas initialisé (ticket 1), il n'y a rien à vérifier.
      - name: Detect workspace
        id: ws
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.ws.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.ws.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.ws.outputs.present == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.ws.outputs.present == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.ws.outputs.present == 'true'
        run: pnpm test

      # pgTAP sur Supabase local : migrations rejouées depuis zéro, puis tests de schéma et de règles par ligne.
      - name: Start Supabase
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        # Les ports de Supabase local (54321 et suivants) sont dans la plage éphémère de Linux : une connexion
        # sortante du runner peut en occuper un par hasard. On réessaie une fois après un arrêt propre.
        run: pnpm db:start || (pnpm db:stop && sleep 5 && pnpm db:start)

      - name: Test database
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        run: pnpm db:reset && pnpm test:db

      - name: Integration tests
        if: steps.ws.outputs.present == 'true' && hashFiles('packages/db/supabase/config.toml') != ''
        run: pnpm test:integration

      - name: End-to-end tests
        if: steps.ws.outputs.present == 'true' && hashFiles('apps/web/playwright.config.ts') != ''
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e

      # Les images de l'API et du moteur doivent toujours pouvoir être construites.
      - name: Build server images
        if: steps.ws.outputs.present == 'true' && hashFiles('infra/docker/Dockerfile') != ''
        run: |
          for app in api engine; do
            [ -f "apps/$app/src/main.ts" ] || continue
            node infra/docker/bundle.mjs "$app" "build/$app/main.mjs"
            docker build -q -f infra/docker/Dockerfile -t "oikos-$app:ci" "build/$app"
          done
